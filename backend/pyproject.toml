[project]
name = "gradewise-backend"
version = "0.1.0"
description = "GradeWise student achievement analytics API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "deepagents>=0.5,<1",
  "faker>=33,<40",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.6,<2",
  "langgraph-sdk>=0.3,<1",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0.36,<3",
  "sqlglot>=26,<30",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"app/agents/prompts.py" = ["E501"]
