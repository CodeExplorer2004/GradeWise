name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端、迁移与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gradewise
          POSTGRES_USER: gradewise
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradewise -d gradewise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://gradewise:ci-password@localhost:5432/gradewise
      READONLY_DATABASE_URL: postgresql+asyncpg://gradewise:ci-password@localhost:5432/gradewise
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      SEED_FAKE_DATA: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: 安装后端依赖
        run: python -m pip install -e ".[dev]"
      - name: Ruff 静态检查
        run: ruff check --no-cache app tests alembic
      - name: Agent worker 语法检查
        run: python -m compileall -q ../agent-worker/app
      - name: 升级数据库
        run: alembic upgrade head
      - name: 检查模型与迁移漂移
        run: alembic check
      - name: 运行后端测试
        run: pytest -q -p no:cacheprovider

  frontend:
    name: 前端构建与依赖审计
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: TypeScript 类型检查
        run: npm exec vue-tsc -- --noEmit -p tsconfig.app.json
      - name: 生产构建
        run: npm run build
      - name: 审计生产依赖
        run: npm audit --omit=dev --audit-level=high

  services:
    name: 服务与 Compose 校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chart-mcp/package-lock.json
      - name: 安装图表服务依赖
        working-directory: chart-mcp
        run: npm ci
      - name: 图表服务语法检查
        working-directory: chart-mcp
        run: node --check src/server.js
      - name: 审计图表服务依赖
        working-directory: chart-mcp
        run: npm audit --omit=dev --audit-level=high
      - name: 校验 Docker Compose
        run: docker compose config --quiet

  e2e:
    name: Playwright 核心端到端测试
    runs-on: ubuntu-latest
    needs: [backend, frontend, services]
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:28080
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端与 Playwright 依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 启动隔离的 E2E 服务栈
        run: >-
          docker compose -p gradewise-e2e
          -f docker-compose.yml -f docker-compose.e2e.yml
          up --build --detach --wait --wait-timeout 240
      - name: 执行登录、问数与图表测试
        working-directory: frontend
        run: npm run test:e2e
      - name: 输出失败服务日志
        if: failure()
        run: >-
          docker compose -p gradewise-e2e
          -f docker-compose.yml -f docker-compose.e2e.yml
          logs --no-color --tail=200
      - name: 上传 Playwright 失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: 清理隔离服务栈
        if: always()
        run: >-
          docker compose -p gradewise-e2e
          -f docker-compose.yml -f docker-compose.e2e.yml
          down --volumes --remove-orphans
